<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OpenTok Demo Video Generator</title>
  <style>
    body {
      background: #0a0a14;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #9055ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    p { color: #8892b0; margin-top: 0; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1200px;
      margin-top: 20px;
    }
    .card {
      background: #13182b;
      border: 1px solid #232d4b;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      width: 225px;
      height: 400px;
      border-radius: 12px;
      background: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    button {
      margin-top: 16px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      margin-top: 8px;
      font-size: 13px;
      color: #00f2fe;
    }
  </style>
</head>
<body>
  <h1>🎬 OpenTok Demo Video Generator</h1>
  <p>Generate high-quality 9:16 vertical demo videos to test uploads and feed playback.</p>

  <div class="grid">
    <!-- Video 1: Cyberpunk Neon -->
    <div class="card">
      <h3>1. CyberTok Neon</h3>
      <canvas id="canvas1" width="720" height="1280"></canvas>
      <button id="btn1" onclick="generateVideo(1, drawCyberpunk, 'opentok-cyber-neon.webm')">Generate & Download (5s)</button>
      <div id="status1" class="status"></div>
    </div>

    <!-- Video 2: Matrix Code Stream -->
    <div class="card">
      <h3>2. Code Stream</h3>
      <canvas id="canvas2" width="720" height="1280"></canvas>
      <button id="btn2" onclick="generateVideo(2, drawMatrix, 'opentok-code-stream.webm')">Generate & Download (5s)</button>
      <div id="status2" class="status"></div>
    </div>

    <!-- Video 3: Neon Sound Wave -->
    <div class="card">
      <h3>3. Neon Visualizer</h3>
      <canvas id="canvas3" width="720" height="1280"></canvas>
      <button id="btn3" onclick="generateVideo(3, drawVisualizer, 'opentok-neon-visualizer.webm')">Generate & Download (5s)</button>
      <div id="status3" class="status"></div>
    </div>

    <!-- Video 4: Retro Synthwave -->
    <div class="card">
      <h3>4. Synthwave Sunset</h3>
      <canvas id="canvas4" width="720" height="1280"></canvas>
      <button id="btn4" onclick="generateVideo(4, drawSynthwave, 'opentok-synthwave-sunset.webm')">Generate & Download (5s)</button>
      <div id="status4" class="status"></div>
    </div>
  </div>

  <script>
    // Animation 1: Cyberpunk Neon
    function drawCyberpunk(ctx, w, h, t) {
      ctx.fillStyle = '#050713';
      ctx.fillRect(0, 0, w, h);

      // Glowing grid
      ctx.strokeStyle = `rgba(0, 242, 254, ${0.15 + Math.sin(t*2)*0.05})`;
      ctx.lineWidth = 2;
      for (let y = 0; y < h; y += 60) {
        ctx.beginPath();
        ctx.moveTo(0, y + (t * 40 % 60));
        ctx.lineTo(w, y + (t * 40 % 60));
        ctx.stroke();
      }
      for (let x = 0; x < w; x += 60) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }

      // Center glowing orb
      const grad = ctx.createRadialGradient(w/2, h/2, 20, w/2, h/2, 250);
      grad.addColorStop(0, '#00f2fe');
      grad.addColorStop(0.4, '#9055ff');
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(w/2, h/2, 220 + Math.sin(t*4)*20, 0, Math.PI*2);
      ctx.fill();

      // Rotating cyber rings
      ctx.save();
      ctx.translate(w/2, h/2);
      ctx.rotate(t * 1.5);
      ctx.strokeStyle = '#00f2fe';
      ctx.lineWidth = 6;
      ctx.setLineDash([40, 20]);
      ctx.beginPath();
      ctx.arc(0, 0, 160, 0, Math.PI*2);
      ctx.stroke();

      ctx.rotate(-t * 2.5);
      ctx.strokeStyle = '#ff007f';
      ctx.setLineDash([20, 15]);
      ctx.beginPath();
      ctx.arc(0, 0, 120, 0, Math.PI*2);
      ctx.stroke();
      ctx.restore();

      // Floating particles
      for (let i = 0; i < 30; i++) {
        const px = (Math.sin(i * 99 + t) * 0.5 + 0.5) * w;
        const py = ((i * 45 - t * 120) % h + h) % h;
        ctx.fillStyle = i % 2 === 0 ? '#00f2fe' : '#ff007f';
        ctx.beginPath();
        ctx.arc(px, py, (i % 4) + 3, 0, Math.PI*2);
        ctx.fill();
      }

      // Overlay text
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 52px system-ui';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#00f2fe';
      ctx.shadowBlur = 20;
      ctx.fillText('OPENTOK', w/2, h/2 - 340);
      ctx.font = '30px system-ui';
      ctx.fillStyle = '#00f2fe';
      ctx.fillText('Privacy First Video Sharing', w/2, h/2 - 290);

      ctx.font = 'bold 36px system-ui';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ff007f';
      ctx.shadowBlur = 15;
      ctx.fillText('⚡ Donations, Not Data', w/2, h/2 + 380);
      ctx.shadowBlur = 0;
    }

    // Animation 2: Matrix Code Stream
    const matrixChars = '01OPENTOK<>{}[]!@#$%^&*=+~:;|';
    function drawMatrix(ctx, w, h, t) {
      ctx.fillStyle = 'rgba(5, 12, 10, 0.25)';
      ctx.fillRect(0, 0, w, h);

      ctx.font = 'bold 24px monospace';
      const cols = 24;
      const colWidth = w / cols;
      for (let i = 0; i < cols; i++) {
        const speed = (i % 5 + 3) * 35;
        const yHead = ((t * speed + i * 180) % (h + 200)) - 100;
        for (let j = 0; j < 15; j++) {
          const y = yHead - j * 26;
          if (y > 0 && y < h) {
            const char = matrixChars[Math.floor(Math.abs(Math.sin(i*77 + j + t*10)) * matrixChars.length) % matrixChars.length];
            if (j === 0) {
              ctx.fillStyle = '#ffffff';
            } else {
              ctx.fillStyle = `rgba(0, 255, 128, ${1 - j/15})`;
            }
            ctx.fillText(char, i * colWidth + 10, y);
          }
        }
      }

      // Center tech badge
      ctx.fillStyle = 'rgba(10, 25, 20, 0.85)';
      ctx.strokeStyle = '#00ff88';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#00ff88';
      ctx.shadowBlur = 25;
      ctx.strokeRect(w/2 - 260, h/2 - 140, 520, 280);
      ctx.fillRect(w/2 - 260, h/2 - 140, 520, 280);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 44px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('<OPENTOK />', w/2, h/2 - 50);
      ctx.font = '28px monospace';
      ctx.fillStyle = '#00ff88';
      ctx.fillText('100% OPEN SOURCE', w/2, h/2 + 10);
      ctx.fillStyle = '#88ffbb';
      ctx.font = '22px monospace';
      ctx.fillText('ZERO TRACKING ALGORITHM', w/2, h/2 + 70);
      ctx.shadowBlur = 0;
    }

    // Animation 3: Neon Sound Visualizer
    function drawVisualizer(ctx, w, h, t) {
      ctx.fillStyle = '#0a0818';
      ctx.fillRect(0, 0, w, h);

      // Central pulsing gradient
      const grad = ctx.createRadialGradient(w/2, h/2, 50, w/2, h/2, 400);
      grad.addColorStop(0, `rgba(168, 85, 247, ${0.4 + Math.sin(t*5)*0.2})`);
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // Bars around circle
      const bars = 48;
      ctx.save();
      ctx.translate(w/2, h/2);
      for (let i = 0; i < bars; i++) {
        const angle = (i / bars) * Math.PI * 2;
        const barHeight = 40 + Math.sin(i * 0.8 + t * 8) * 80 + Math.cos(i * 1.5 - t * 4) * 60;
        ctx.rotate(Math.PI * 2 / bars);
        const barGrad = ctx.createLinearGradient(0, 120, 0, 120 + barHeight);
        barGrad.addColorStop(0, '#ec4899');
        barGrad.addColorStop(0.5, '#a855f7');
        barGrad.addColorStop(1, '#38bdf8');
        ctx.fillStyle = barGrad;
        ctx.fillRect(-6, 120, 12, Math.max(10, barHeight));
      }
      ctx.restore();

      // Title
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 50px system-ui';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#ec4899';
      ctx.shadowBlur = 20;
      ctx.fillText('VIBE CHECK', w/2, h/2 - 320);
      ctx.font = '28px system-ui';
      ctx.fillStyle = '#38bdf8';
      ctx.fillText('Creators First Platform', w/2, h/2 + 360);
      ctx.shadowBlur = 0;
    }

    // Animation 4: Synthwave Sunset
    function drawSynthwave(ctx, w, h, t) {
      // Sky gradient
      const sky = ctx.createLinearGradient(0, 0, 0, h*0.65);
      sky.addColorStop(0, '#0f051d');
      sky.addColorStop(0.5, '#3b0764');
      sky.addColorStop(0.85, '#e11d48');
      sky.addColorStop(1, '#fbbf24');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h*0.65);

      // Sun
      const sunGrad = ctx.createLinearGradient(w/2, h*0.35, w/2, h*0.65);
      sunGrad.addColorStop(0, '#fef08a');
      sunGrad.addColorStop(0.6, '#f43f5e');
      sunGrad.addColorStop(1, '#881337');
      ctx.fillStyle = sunGrad;
      ctx.beginPath();
      ctx.arc(w/2, h*0.5, 180, 0, Math.PI, true);
      ctx.fill();

      // Sun cuts
      ctx.fillStyle = '#0f051d';
      for (let i = 0; i < 6; i++) {
        const y = h*0.48 + i * 18;
        ctx.fillRect(w/2 - 180, y, 360, 4 + i * 2);
      }

      // Mountain silhouettes
      ctx.fillStyle = '#180728';
      ctx.beginPath();
      ctx.moveTo(0, h*0.65);
      ctx.lineTo(120, h*0.56);
      ctx.lineTo(260, h*0.63);
      ctx.lineTo(420, h*0.54);
      ctx.lineTo(580, h*0.62);
      ctx.lineTo(w, h*0.57);
      ctx.lineTo(w, h*0.65);
      ctx.closePath();
      ctx.fill();

      // Grid Ground
      ctx.fillStyle = '#090114';
      ctx.fillRect(0, h*0.65, w, h*0.35);

      ctx.strokeStyle = '#06b6d4';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#06b6d4';
      ctx.shadowBlur = 10;

      // Vertical perspective lines
      for (let x = -w*0.5; x <= w*1.5; x += 100) {
        ctx.beginPath();
        ctx.moveTo(w/2, h*0.65);
        ctx.lineTo(x, h);
        ctx.stroke();
      }

      // Horizontal lines moving forward
      const gridOffset = (t * 80) % 50;
      for (let y = h*0.65; y < h; y += Math.pow((y - h*0.65)/4, 1.2) + 15) {
        ctx.beginPath();
        ctx.moveTo(0, y + gridOffset * ((y - h*0.65)/150));
        ctx.lineTo(w, y + gridOffset * ((y - h*0.65)/150));
        ctx.stroke();
      }
      ctx.shadowBlur = 0;

      // Title
      ctx.fillStyle = '#ffffff';
      ctx.font = 'italic bold 56px system-ui';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#ec4899';
      ctx.shadowBlur = 25;
      ctx.fillText('OPENTOK', w/2, 140);
      ctx.font = '26px system-ui';
      ctx.fillStyle = '#fef08a';
      ctx.fillText('The Transparent Video App', w/2, 190);
      ctx.shadowBlur = 0;
    }

    // Live previews on canvas
    const drawFns = [drawCyberpunk, drawMatrix, drawVisualizer, drawSynthwave];
    for (let i = 1; i <= 4; i++) {
      const c = document.getElementById('canvas' + i);
      const ctx = c.getContext('2d');
      drawFns[i-1](ctx, 720, 1280, 1.5);
    }

    // Video recording function
    async function generateVideo(id, drawFn, filename) {
      const canvas = document.getElementById('canvas' + id);
      const ctx = canvas.getContext('2d');
      const btn = document.getElementById('btn' + id);
      const status = document.getElementById('status' + id);

      btn.disabled = true;
      status.textContent = 'Recording video (5s)...';

      const stream = canvas.captureStream(30);
      let options = { mimeType: 'video/webm;codecs=vp9' };
      if (!MediaRecorder.isTypeSupported(options.mimeType)) {
        options = { mimeType: 'video/webm' };
      }

      const recorder = new MediaRecorder(stream, options);
      const chunks = [];

      recorder.ondataavailable = e => {
        if (e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        status.textContent = '✅ Downloaded ' + filename;
        btn.disabled = false;
      };

      recorder.start();
      const startTime = performance.now();
      const duration = 5000; // 5 seconds

      function renderFrame(now) {
        const elapsed = now - startTime;
        const t = elapsed / 1000;
        drawFn(ctx, 720, 1280, t);

        if (elapsed < duration) {
          requestAnimationFrame(renderFrame);
        } else {
          recorder.stop();
        }
      }
      requestAnimationFrame(renderFrame);
    }
  </script>
</body>
</html>
